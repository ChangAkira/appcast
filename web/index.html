<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>手机当前应用 · 实时看板</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #141822; --line: #232936; --txt: #e8ecf4; --dim: #8b95a8;
    --accent: #4ade80; --warn: #fbbf24; --chip: #1b2130;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 70% -10%, #16203a 0%, var(--bg) 60%);
    color: var(--txt);
    font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    padding: clamp(16px, 4vw, 40px);
    display: flex; flex-direction: column; gap: 22px; align-items: center;
  }
  main { width: 100%; max-width: 980px; display: flex; flex-direction: column; gap: 22px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .16em; color: var(--dim); text-transform: uppercase; }
  #conn { font-size: 12px; color: var(--dim); }
  #conn.live::before { content: "●"; color: var(--accent); margin-right: 6px; }
  #conn.poll::before { content: "●"; color: var(--warn); margin-right: 6px; }
  #conn.down::before { content: "●"; color: #ef4444; margin-right: 6px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: clamp(18px, 3vw, 28px); }
  .devices { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .dev-top { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #4b5563; flex: none; }
  .dot.on { background: var(--accent); box-shadow: 0 0 0 4px rgba(74,222,128,.16); }
  .dot.off { background: #6b7280; }
  .app { font-size: clamp(38px, 9vw, 64px); font-weight: 700; line-height: 1.15; margin: 14px 0 6px; word-break: break-word; }
  .app.idle { color: var(--dim); font-weight: 500; font-size: clamp(24px, 5vw, 34px); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip { background: var(--chip); border: 1px solid var(--line); color: var(--dim); border-radius: 999px;
          padding: 5px 12px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .chip.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .chip.state-off, .chip.state-lock { color: var(--warn); border-color: #4b3d18; background: #241f10; }

  .cols { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .1em; color: var(--dim); text-transform: uppercase; margin-bottom: 14px; }
  ol.timeline { list-style: none; display: flex; flex-direction: column; }
  ol.timeline li { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  ol.timeline li:last-child { border-bottom: 0; }
  ol.timeline .t { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--dim); flex: none; }
  ol.timeline .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ol.timeline .d { color: var(--dim); font-size: 12px; flex: none; font-variant-numeric: tabular-nums; }
  .bars { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13px; }
  .bar-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-dur { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
  .bar { grid-column: 1 / -1; height: 6px; border-radius: 4px; background: var(--chip); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #38bdf8, #4ade80); }
  .empty { color: var(--dim); font-size: 13px; }
  footer { color: #5b6478; font-size: 12px; text-align: center; }
  #gate { max-width: 420px; }
  #gate input { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line);
                background: #0e1219; color: var(--txt); font-size: 15px; margin: 14px 0; }
  #gate button { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: var(--accent);
                 color: #06240f; font-weight: 700; font-size: 15px; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>手机当前应用 · 实时看板</h1>
    <div id="conn" class="down">连接中…</div>
  </header>

  <section id="gate" class="card" hidden>
    <h2>需要访问密钥</h2>
    <p class="empty">请在网址后加上 <code>?k=你的 viewKey</code>，或直接在这里输入。</p>
    <input id="gate-in" placeholder="viewKey" autocomplete="off">
    <button id="gate-btn">进入</button>
  </section>

  <section class="devices" id="devices"></section>

  <section class="cols">
    <div class="card">
      <h2>切换记录</h2>
      <ol class="timeline" id="timeline"><li class="empty">暂无数据</li></ol>
    </div>
    <div class="card">
      <h2>今日使用时长（估算）</h2>
      <div class="bars" id="bars"><div class="empty">暂无数据</div></div>
    </div>
  </section>

  <footer>数据仅保存在本机内存与 data/state.json · 手机息屏后不再刷新时按离线处理</footer>
</main>

<script>
(() => {
  let KEY = new URLSearchParams(location.search).get('k') || localStorage.getItem('appcast.key') || '';
  const $ = (id) => document.getElementById(id);
  const conn = $('conn'), devices = $('devices'), timeline = $('timeline'), bars = $('bars');

  // 首屏渲染：每个设备一张卡片；设备多于一个时，切换记录/时长跟随点选
  let snap = null;
  let focusId = null;
  let es = null, pollTimer = null;

  const pad = (n) => String(n).padStart(2, '0');
  const hhmmss = (ms) => {
    const s = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
    return h ? `${h}:${pad(m)}:${pad(s % 60)}` : `${m}:${pad(s % 60)}`;
  };
  const dur = (ms) => {
    const m = Math.floor(ms / 60000);
    return m >= 60 ? `${Math.floor(m / 60)} 小时 ${m % 60} 分` : m >= 1 ? `${m} 分钟` : `${Math.floor(ms / 1000)} 秒`;
  };
  const clock = (ts) => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

  function setConn(cls, text) { conn.className = cls; conn.textContent = text; }

  function start() {
    localStorage.setItem('appcast.key', KEY);
    $('gate').hidden = true;
    connect();
  }

  function connect() {
    closeConn();
    try {
      es = new EventSource(`/api/stream?k=${encodeURIComponent(KEY)}`);
      es.addEventListener('state', (e) => { setConn('live', '实时连接'); render(JSON.parse(e.data)); });
      es.onopen = () => { setConn('live', '实时连接'); clearTimeout(boot); };
      const boot = setTimeout(() => { if (!es || es.readyState !== 1) fallback(); }, 6000);
      es.onerror = () => { clearTimeout(boot); fallback(); };
    } catch { fallback(); }
  }

  function closeConn() { if (es) { es.close(); es = null; } if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

  function fallback() {
    if (pollTimer) return;
    closeConnOnly();
    async function tick() {
      try {
        const r = await fetch(`/api/state?k=${encodeURIComponent(KEY)}`, { cache: 'no-store' });
        if (!r.ok) throw 0;
        setConn('poll', '轮询中'); render(await r.json());
      } catch { setConn('down', '连接中断'); }
    }
    function closeConnOnly() { if (es) { es.close(); es = null; } }
    tick();
    pollTimer = setInterval(tick, 5000);
  }

  function render(s) {
    snap = s;
    if (!focusId || !s.devices.some((d) => d.id === focusId)) focusId = s.devices[0]?.id || null;
    devices.innerHTML = '';
    for (const d of s.devices) devices.appendChild(card(d));
    renderTimeline();
    renderBars();
  }

  function card(d) {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.id = d.id;
    el.style.cursor = snap.devices.length > 1 ? 'pointer' : 'default';
    el.onclick = () => { focusId = d.id; renderTimeline(); renderBars(); };

    const top = document.createElement('div');
    top.className = 'dev-top';
    top.innerHTML = `<span class="dot ${d.online ? 'on' : 'off'}"></span><span>${esc(d.name)}</span>` +
      (d.online ? '' : '<span>离线</span>');
    el.appendChild(top);

    const isLock = d.screen === 'off' || d.screen === 'lock';
    const app = document.createElement('div');
    app.className = 'app' + (!d.app || isLock ? ' idle' : '');
    app.textContent = d.app ? (isLock ? (d.screen === 'off' ? '屏幕已关闭' : '已锁屏') : d.app) : '等待手机上报…';
    el.appendChild(app);

    const meta = document.createElement('div');
    meta.className = 'meta';
    const chip = (cls, text, dataset) => {
      const c = document.createElement('span');
      c.className = 'chip' + (cls ? ' ' + cls : '');
      c.textContent = text;
      if (dataset) for (const [k, v] of Object.entries(dataset)) c.dataset[k] = v;
      meta.appendChild(c);
    };
    if (d.pkg && !isLock) chip('mono', d.pkg);
    if (isLock) chip('state-' + d.screen, d.screen === 'lock' ? '已锁屏' : '屏幕已关闭');
    if (d.lastSeen) {
      chip('', '已持续 0:00', { since: d.lastSeen });
      chip('', '同步于 ' + clock(d.lastSeen), { age: d.lastSeen });
    }
    el.appendChild(meta);
    return el;
  }

  function focusDevice() { return snap?.devices.find((d) => d.id === focusId); }

  // 一段使用的结束时间：有下一个事件就用下一个事件的时间；
  // 仍是当前应用时，在线就按「现在」，离线则按最后一次同步时间（手机停止上报还在用）
  function segEnd(d, i, list) {
    if (i + 1 < list.length) return list[i + 1].ts;
    return d.online ? snap.now : Math.min(snap.now, d.lastSeen || snap.now);
  }
  const MAX_SEG = 4 * 3600_000;

  function renderList(host, rows, emptyText) {
    host.innerHTML = '';
    if (!rows.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = emptyText;
      host.appendChild(li);
      return;
    }
    for (const r of rows) host.appendChild(r);
  }

  function renderTimeline() {
    const d = focusDevice();
    const list = d ? d.events.slice(-14) : [];
    const rows = [];
    for (let i = list.length - 1; i >= 0; i--) {
      const e = list[i];
      const li = document.createElement('li');
      const t = document.createElement('span');
      t.className = 't';
      t.textContent = clock(e.ts);
      const n = document.createElement('span');
      n.className = 'n';
      n.textContent = e.screen === 'off' ? '屏幕关闭' : e.screen === 'lock' ? '锁屏' : (e.app || e.pkg || '未知');
      const dd = document.createElement('span');
      dd.className = 'd';
      const gap = Math.min(segEnd(d, i, list) - e.ts, MAX_SEG);
      dd.textContent = i === list.length - 1 ? '进行中' : dur(gap);
      li.append(t, n, dd);
      rows.push(li);
    }
    renderList(timeline, rows, '暂无数据');
  }

  function renderBars() {
    const d = focusDevice();
    if (!d || !d.events.length) return void renderList(bars, [], '暂无数据');
    const day = new Date(); day.setHours(0, 0, 0, 0);
    const list = d.events.filter((e) => e.ts >= day.getTime());
    if (!list.length) return void renderList(bars, [], '今天还没有记录');

    const total = {};
    for (let i = 0; i < list.length; i++) {
      if (list[i].screen && list[i].screen !== 'on') continue;
      const ms = Math.min(segEnd(d, i, list) - list[i].ts, MAX_SEG);
      if (ms <= 0) continue;
      const name = list[i].app || list[i].pkg || '未知';
      total[name] = (total[name] || 0) + ms;
    }
    const rows = Object.entries(total).sort((a, b) => b[1] - a[1]).slice(0, 8);
    if (!rows.length) return void renderList(bars, [], '今天还没有记录');
    const max = rows[0][1];
    const barsRows = rows.map(([name, ms]) => {
      const el = document.createElement('div');
      el.className = 'bar-row';
      const nm = document.createElement('span');
      nm.className = 'bar-name';
      nm.textContent = name;
      const du = document.createElement('span');
      du.className = 'bar-dur';
      du.textContent = dur(ms);
      const bar = document.createElement('span');
      bar.className = 'bar';
      const fill = document.createElement('i');
      fill.style.width = Math.max(4, (ms / max) * 100) + '%';
      bar.appendChild(fill);
      el.append(nm, du, bar);
      return el;
    });
    renderList(bars, barsRows, '今天还没有记录');
  }

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  setInterval(() => {
    if (!snap) return;
    const now = Date.now();
    for (const c of devices.children) {
      const since = c.querySelector('[data-since]'), age = c.querySelector('[data-age]');
      if (since) since.textContent = '已持续 ' + hhmmss(now - +since.dataset.since);
      if (age) age.textContent = '同步于 ' + clock(+age.dataset.age);
    }
    if (snap.devices.length === 1) renderBars();
  }, 1000);

  $('gate-btn').onclick = () => { KEY = $('gate-in').value.trim(); if (KEY) start(); };
  $('gate-in').onkeydown = (e) => { if (e.key === 'Enter') $('gate-btn').click(); };

  if (!KEY) { $('gate').hidden = false; } else start();
  addEventListener('online', connect);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) connect(); });
})();
</script>
</body>
</html>
