<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="60">
<title>更新功能中</title>
<style>
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center; text-align: center;
    background: radial-gradient(900px 600px at 50% -10%, #16203a 0%, #0b0d12 60%);
    color: #e8ecf4;
    font: 15px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    padding: 24px;
  }
  h1 { font-size: clamp(34px, 8vw, 56px); font-weight: 700; margin: 0 0 10px; letter-spacing: .02em; }
  p { color: #8b95a8; margin: 0 auto; max-width: 30em; }
  .mark { width: 54px; height: 54px; margin: 0 auto 26px; border-radius: 50%;
          border: 2px solid #232936; border-top-color: #4ade80; animation: spin 1.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  small { display: block; margin-top: 34px; color: #5b6478; font-size: 12px; }
</style>
</head>
<body>
  <div>
    <div class="mark"></div>
    <h1>更新功能中</h1>
    <p>这个看板暂时停用，正在加新功能。手机的上报此刻不会被记录，恢复后会自动继续。</p>
    <small>本页面每 60 秒自动重试 · appcast</small>
  </div>
</body>
</html>
